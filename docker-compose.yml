# docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nest_user -d nest_stocks_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  nestjs-app:
    build:
      context: .
      dockerfile: Dockerfile.development
    container_name: nestjs_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT}
      FUSE_API_BASE_URL: ${FUSE_API_BASE_URL}
      FUSE_API_KEY: ${FUSE_API_KEY}
      FUSE_STOCK_CACHE_TTL_MS: ${FUSE_STOCK_CACHE_TTL_MS}
      MAX_PAGES_TO_FETCH: ${MAX_PAGES_TO_FETCH}
      FUSE_MAX_API_RETRIES: ${FUSE_MAX_API_RETRIES}
      # DB connection settings
      DATABASE_HOST: db
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE}
      DATABASE_LOGGING: ${DATABASE_LOGGING}
      #Mail settings
      MAILTRAP_HOST: ${MAILTRAP_HOST}
      MAILTRAP_PORT: ${MAILTRAP_PORT}
      MAILTRAP_SECURE: ${MAILTRAP_SECURE}
      MAILTRAP_USER: ${MAILTRAP_USER}
      MAILTRAP_PASS: ${MAILTRAP_PASS}
      MAILTRAP_MAX_API_RETRIES: ${MAILTRAP_MAX_API_RETRIES}
      MAILTRAP_DELAY_MS: ${MAILTRAP_DELAY_MS}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  db_data:
