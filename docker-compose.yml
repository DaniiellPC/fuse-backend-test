# docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: nest_stocks_db
      POSTGRES_USER: nest_user
      POSTGRES_PASSWORD: nest_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nest_user -d nest_stocks_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: